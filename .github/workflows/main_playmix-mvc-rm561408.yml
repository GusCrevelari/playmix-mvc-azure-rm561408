# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: 'Build and deploy JAR app to Azure Web App: playmix-mvc-rm561408'

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean install
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'playmix-mvc-rm561408'
          slot-name: 'production'
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_4d8546a60cb24aabaa1bd7abfb981b60 }}
          package: '${{ github.workspace }}/target/*.jar'
